<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-container">
        <h1>Developer Workshop Registration</h1>

        <form>
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input id="full-name" name="full-name" type="text" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>
                <select id="experience" name="experience" required>
                    <option value="">Select an option</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Workshop Track</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="track" value="frontend-web" required>
                        <span>Frontend Web</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="track" value="backend-apis">
                        <span>Backend APIs</span>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="track" value="uiux-design">
                        <span>UI/UX Design</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-option">
                    <input type="checkbox" name="notifications">
                    <span>I agree to receive event updates.</span>
                </label>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </main>
</body>
</html>
